name: IMPORT FIX22

on:
  workflow_dispatch:

jobs:
  import-fix22:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Reassemble FIX22 archive
        shell: bash
        run: |
          set -euo pipefail
          test -f Roma-BRT_FIX22_PART1.bin
          test -f Roma-BRT_FIX22_PART2.bin
          cat Roma-BRT_FIX22_PART1.bin Roma-BRT_FIX22_PART2.bin > Roma-BRT_FIX22.zip
          unzip -t Roma-BRT_FIX22.zip

      - name: Import project files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/roma_fix22
          mkdir -p /tmp/roma_fix22
          unzip -q Roma-BRT_FIX22.zip -d /tmp/roma_fix22
          shopt -s dotglob nullglob
          entries=(/tmp/roma_fix22/*)
          if [ ${#entries[@]} -eq 1 ] && [ -d "${entries[0]}" ]; then
            src="${entries[0]}"
          else
            src="/tmp/roma_fix22"
          fi
          rm -f Roma-BRT_FIX22_PART1.bin Roma-BRT_FIX22_PART2.bin Roma-BRT_FIX22.zip
          cp -a "$src"/. .
          rm -rf /tmp/roma_fix22

      - name: Commit imported project
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Import Roma-BRT FIX22 project"
          git push origin HEAD:main
