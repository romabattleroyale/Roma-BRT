name: Tiber POI verified downloader

on:
  push:
    branches:
      - poi-assets-trastevere

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Verify downloader
        run: test -f tools/download_tiber_assets.sh
      - name: Downloader script syntax
        run: bash -n tools/download_tiber_assets.sh
      - name: Install glTF Transform
        run: |
          npm install --global @gltf-transform/cli
          gltf-transform --version
          python3 -m pip install --user pygltflib
      - name: Download and validate 9 GLB
        env:
          SKETCHFAB_TOKEN: ${{ secrets.SKETCHFAB_TOKEN }}
        run: |
          set -euo pipefail
          bash tools/download_tiber_assets.sh
      - name: Package optimized asset pack
        run: |
          set -euo pipefail
          cd poi_test_tiber_island/poi_test
          zip -qr ../Trastevere_Isola_Tiberina_Optimized_Assets.zip assets/models
          ls -lh ../Trastevere_Isola_Tiberina_Optimized_Assets.zip
      - name: Upload optimized asset pack
        uses: actions/upload-artifact@v4
        with:
          name: Trastevere-Isola-Tiberina-Optimized-Assets
          path: poi_test_tiber_island/Trastevere_Isola_Tiberina_Optimized_Assets.zip
          if-no-files-found: error
          retention-days: 14
