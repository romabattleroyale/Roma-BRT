name: Tiber POI verified downloader

on:
  push:
    branches:
      - poi-assets-trastevere

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Runner smoke test
        run: |
          echo "TIBER_WORKFLOW_RUNNER_OK"
          test -n "${GITHUB_SHA}"
