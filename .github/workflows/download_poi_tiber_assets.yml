name: Tiber POI verified downloader

on:
  push:
    branches:
      - poi-assets-trastevere

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify downloader
        run: test -f tools/download_tiber_assets.sh
      - name: Downloader script syntax
        run: bash -n tools/download_tiber_assets.sh
      - name: Verify Sketchfab token
        env:
          SKETCHFAB_TOKEN: ${{ secrets.SKETCHFAB_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$SKETCHFAB_TOKEN"
          echo "SKETCHFAB_TOKEN is configured"
