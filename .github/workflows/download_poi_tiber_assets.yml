name: Tiber POI downloader

on:
  push:
    branches:
      - poi-assets-trastevere
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify workflow runner
        run: |
          echo "Tiber POI workflow runner is active"
          test -n "${GITHUB_SHA}"
          test -f ".github/workflows/download_poi_tiber_assets.yml"
