name: City Library Ingest

on:
  push:
    paths:
      - 'incoming_libraries/*.zip'
  workflow_dispatch:
    inputs:
      archive:
        description: 'ZIP in incoming_libraries/'
        required: true
        type: string
      destination:
        description: 'Optional destination inside city_library/'
        required: false
        type: string
      dry_run:
        description: 'Validate only; do not modify the repository'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: city-library-ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select archive
        id: select
        shell: bash
        env:
          INPUT_ARCHIVE: ${{ inputs.archive }}
        run: |
          set -euo pipefail
          if [[ -n "$INPUT_ARCHIVE" ]]; then
            ARCHIVE="$INPUT_ARCHIVE"
          else
            mapfile -t ZIPS < <(find incoming_libraries -maxdepth 1 -type f -name '*.zip' -print | sort)
            if [[ ${#ZIPS[@]} -ne 1 ]]; then
              echo "Expected exactly one ZIP in incoming_libraries/. Found ${#ZIPS[@]}"
              printf ' - %s\n' "${ZIPS[@]}"
              exit 1
            fi
            ARCHIVE="${ZIPS[0]}"
          fi
          test -f "$ARCHIVE"
          echo "archive=$ARCHIVE" >> "$GITHUB_OUTPUT"

      - name: Prepare workspace
        run: |
          set -euo pipefail
          rm -rf .library_ingest
          mkdir -p .library_ingest/unpacked
          unzip -q "${{ steps.select.outputs.archive }}" -d .library_ingest/unpacked

      - name: Validate package and calculate destination
        id: validate
        shell: bash
        env:
          REQUESTED_DESTINATION: ${{ inputs.destination }}
          ARCHIVE: ${{ steps.select.outputs.archive }}
        run: |
          set -euo pipefail
          ROOT=".library_ingest/unpacked"

          python3 - <<'PY'
          import os, zipfile
          p=os.environ['ARCHIVE']
          with zipfile.ZipFile(p) as z:
              for n in z.namelist():
                  n=n.replace('\\','/')
                  if n.startswith('/') or '..' in n.split('/'):
                      raise SystemExit(f'Unsafe ZIP path: {n}')
                  info=z.getinfo(n)
                  if not info.is_dir() and info.file_size > 90*1024*1024:
                      raise SystemExit(f'File exceeds 90 MiB: {n}')
          PY

          mapfile -t TOP < <(find "$ROOT" -mindepth 1 -maxdepth 1 -type d -print)
          FILES_AT_TOP=$(find "$ROOT" -mindepth 1 -maxdepth 1 -type f | wc -l)
          if [[ ${#TOP[@]} -eq 1 && "$FILES_AT_TOP" -eq 0 ]]; then ROOT="${TOP[0]}"; fi

          if find "$ROOT" -type d -name '.godot' -print -quit | grep -q . || find "$ROOT" -type f -name 'project.godot' -print -quit | grep -q .; then
            echo 'Rejected: package contains a complete Godot project.'
            exit 1
          fi

          DEST="$REQUESTED_DESTINATION"
          if [[ -z "$DEST" && -f "$ROOT/library_manifest.json" ]]; then
            DEST=$(python3 - <<'PY'
          import json
          d=json.load(open('.library_ingest/unpacked/library_manifest.json',encoding='utf-8'))
          print(d.get('destination',''))
          PY
            )
          fi

          ARCHIVE_NAME=$(basename "$ARCHIVE")
          if [[ -z "$DEST" && "$ARCHIVE_NAME" == RomaRoyale_Architecture_Library_V11* ]]; then
            DEST='city_library/buildings/houses/roma_architecture_library_v11'
          fi
          [[ "$DEST" == city_library/* ]] || { echo "Destination must be inside city_library/: $DEST"; exit 1; }

          if [[ "$DEST" == city_library/buildings/houses/* ]]; then
            test -f "$ROOT/data/building_catalog.json" || { echo 'Missing data/building_catalog.json'; exit 1; }
            python3 - <<'PY'
          import json,glob
          files=glob.glob('.library_ingest/unpacked/**/data/building_catalog.json',recursive=True)
          if not files: raise SystemExit('building_catalog.json not found')
          d=json.load(open(files[0],encoding='utf-8'))
          if not isinstance(d,list) or not d: raise SystemExit('building catalog must be a non-empty array')
          ids=[str(x.get('id','')) for x in d if isinstance(x,dict)]
          if len(ids)!=len(set(ids)): raise SystemExit('Duplicate building IDs')
          print(f'Validated house catalog: {len(ids)} archetypes')
          PY
          fi

          if grep -RniE 'Road Generator|road_generator[[:space:]]*:[[:space:]]*true' "$ROOT" --exclude='*.png' --exclude='*.jpg' --exclude='*.jpeg' --exclude='*.exr' --exclude='*.hdr' --exclude='*.glb' --exclude='*.gltf' 2>/dev/null; then
            echo 'Rejected: Road Generator enablement marker found.'
            exit 1
          fi

          echo "root=$ROOT" >> "$GITHUB_OUTPUT"
          echo "destination=$DEST" >> "$GITHUB_OUTPUT"

      - name: Package summary
        env:
          ROOT: ${{ steps.validate.outputs.root }}
          DEST: ${{ steps.validate.outputs.destination }}
        run: |
          echo "Destination: $DEST"
          echo "Files: $(find "$ROOT" -type f | wc -l)"
          echo "Size: $(du -sh "$ROOT" | cut -f1)"
          find "$ROOT" -maxdepth 2 -type f | sort | head -80

      - name: Install into City Library
        if: '${{ !inputs.dry_run }}'
        env:
          ROOT: ${{ steps.validate.outputs.root }}
          DEST: ${{ steps.validate.outputs.destination }}
        run: |
          set -euo pipefail
          mkdir -p "$DEST"
          rsync -a --delete "$ROOT/" "$DEST/"
          rm -rf .library_ingest

      - name: Commit library package
        if: '${{ !inputs.dry_run }}'
        env:
          DEST: ${{ steps.validate.outputs.destination }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$DEST"
          if git diff --cached --quiet; then echo 'No changes.'; exit 0; fi
          git commit -m "library: ingest $(basename "$DEST")"
          git push

      - name: Dry-run notice
        if: '${{ inputs.dry_run }}'
        run: echo 'DRY RUN: package validated; repository was not modified.'
