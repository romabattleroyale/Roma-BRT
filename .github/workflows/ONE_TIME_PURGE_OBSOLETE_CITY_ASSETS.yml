name: One-time purge obsolete city assets

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  purge:
    if: ${{ github.event.head_commit.message != 'chore: purge obsolete city assets' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove obsolete HLOD and LOD1 assets
        run: |
          git rm -r --ignore-unmatch baked_city/hlod baked_city/lod1
          if git diff --cached --quiet; then
            echo "No obsolete city assets found."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: purge obsolete city assets"
          git push origin HEAD:main
