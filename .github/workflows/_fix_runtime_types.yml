name: _Fix Runtime Types

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Fix only reported Godot inference errors
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          python3 - <<'PY'
          from pathlib import Path

          roads = Path('roads/simple_roads.gd')
          text = roads.read_text()
          replacements = {
              'var curb_center :=': 'var curb_center: Vector3 =',
              'var sidewalk_center :=': 'var sidewalk_center: Vector3 =',
              'var gutter_center :=': 'var gutter_center: Vector3 =',
              'var edge_center :=': 'var edge_center: Vector3 =',
              'var p := center + side * side_sign * (width * 0.5 - 0.18)': 'var p: Vector3 = center + side * side_sign * (width * 0.5 - 0.18)',
              'var rail :=': 'var rail: Vector3 =',
          }
          for old, new in replacements.items():
              text = text.replace(old, new)
          roads.write_text(text)

          poi = Path('city_library/poi/poi_manager.gd')
          text = poi.read_text()
          text = text.replace('var target_x := lerp(', 'var target_x: float = lerp(')
          text = text.replace('var target_z := lerp(', 'var target_z: float = lerp(')
          poi.write_text(text)
          PY

          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add roads/simple_roads.gd city_library/poi/poi_manager.gd
          if git diff --cached --quiet; then
            echo 'RUNTIME_TYPE_FIX=NO_CHANGES'
            exit 0
          fi
          git commit -m 'fix: resolve Godot runtime type inference errors'
          git push origin main

      - name: Remove temporary fixer workflow
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          git rm .github/workflows/_fix_runtime_types.yml
          git commit -m 'chore: remove temporary runtime type fixer'
          git push origin main
