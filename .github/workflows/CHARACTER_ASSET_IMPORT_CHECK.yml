name: Character Asset Import Check

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'assets/characters/**'
      - 'assets/animations/**'
      - 'tools/verify_character_assets.gd'
      - '.github/workflows/CHARACTER_ASSET_IMPORT_CHECK.yml'

permissions:
  contents: read

jobs:
  import-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Godot 4.7.2
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .runtime/godot
          curl -L --fail --retry 3 -o .runtime/godot/godot.zip \
            'https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip'
          unzip -q .runtime/godot/godot.zip -d .runtime/godot
          GODOT_BIN="$(find .runtime/godot -maxdepth 2 -type f -name 'Godot_v4.7.2-stable_linux.x86_64' | head -n 1)"
          test -n "$GODOT_BIN"
          chmod +x "$GODOT_BIN"
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"
          "$GODOT_BIN" --version

      - name: Import project assets
        run: |
          set -euo pipefail
          "$GODOT_BIN" --headless --editor --path . --quit

      - name: Verify character skeleton and locomotion clips
        run: |
          set -euo pipefail
          "$GODOT_BIN" --headless --path . --script res://tools/verify_character_assets.gd
