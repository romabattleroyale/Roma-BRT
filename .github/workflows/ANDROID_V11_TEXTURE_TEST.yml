name: Android V11 Texture Test

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'mobile_texture_test.tscn'
      - 'tools/mobile_texture_visual_test.gd'
      - 'baked_city/**'
      - 'city_library/buildings/houses/roma_architecture_library_v11/assets/textures/**'
      - 'export_presets.cfg'
      - 'project.godot'
      - '.github/workflows/ANDROID_V11_TEXTURE_TEST.yml'

permissions:
  contents: read

concurrency:
  group: android-v11-texture-test
  cancel-in-progress: true

jobs:
  android-texture-test:
    name: Android V11 texture visual test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout Roma-BRT
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'
      - name: Download Godot 4.7.2
        run: |
          set -euo pipefail
          mkdir -p .runtime/godot
          curl -L --fail --retry 3 -o .runtime/godot/godot.zip 'https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip'
          unzip -q .runtime/godot/godot.zip -d .runtime/godot
          GODOT_BIN=$(find .runtime/godot -maxdepth 2 -type f -name 'Godot_v4.7.2-stable_linux.x86_64' | head -n 1)
          chmod +x "$GODOT_BIN"
          ln -sf "$(realpath "$GODOT_BIN")" .runtime/godot/godot
          .runtime/godot/godot --version
      - name: Install Godot Android export templates
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/share/godot/export_templates/4.7.2.stable"
          curl -L --fail --retry 3 -o /tmp/godot_templates.tpz 'https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz'
          rm -rf /tmp/godot_templates && mkdir -p /tmp/godot_templates
          unzip -q /tmp/godot_templates.tpz -d /tmp/godot_templates
          cp /tmp/godot_templates/templates/android_debug.apk "$HOME/.local/share/godot/export_templates/4.7.2.stable/android_debug.apk"
          cp /tmp/godot_templates/templates/android_release.apk "$HOME/.local/share/godot/export_templates/4.7.2.stable/android_release.apk"
      - name: Prepare debug keystore
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname 'CN=Android Debug,O=Android,C=US'; fi
      - name: Import project resources
        run: .runtime/godot/godot --headless --editor --path . --quit
      - name: Switch temporary Android test scene and x86_64 export
        run: |
          set -euo pipefail
          cp project.godot /tmp/project.godot.original
          cp export_presets.cfg /tmp/export_presets.cfg.original
          sed -i 's#run/main_scene="res://main.tscn"#run/main_scene="res://mobile_texture_test.tscn"#' project.godot
          sed -i 's#architectures/x86_64=false#architectures/x86_64=true#' export_presets.cfg
          grep -F 'run/main_scene="res://mobile_texture_test.tscn"' project.godot
          grep -F 'architectures/x86_64=true' export_presets.cfg
      - name: Export Android texture test APK
        run: |
          set -euo pipefail
          mkdir -p build
          .runtime/godot/godot --headless --path . --export-debug Android build/Roma-BRT-V11-Android-TextureTest.apk
          test -s build/Roma-BRT-V11-Android-TextureTest.apk
      - name: Restore project files
        if: always()
        run: |
          cp /tmp/project.godot.original project.godot
          cp /tmp/export_presets.cfg.original export_presets.cfg
      - name: Run APK on Android emulator and capture screenshot
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          force-avd-creation: true
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          script: |
            set -euo pipefail
            adb install -r build/Roma-BRT-V11-Android-TextureTest.apk
            adb shell am force-stop com.romabattleroyale.romabrtprobe
            adb shell am start -n com.romabattleroyale.romabrtprobe/.MainActivity
            sleep 8
            adb logcat -d > build/android-texture-logcat.txt
            adb exec-out screencap -p > build/android-texture-screenshot.png
            grep -F 'ANDROID_TEXTURE_TEST PASS' build/android-texture-logcat.txt
            texture_count=$(grep -c '^.*ANDROID_TEXTURE:' build/android-texture-logcat.txt || true)
            test "$texture_count" -ge 14
      - name: Verify screenshot is visually non-flat
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from PIL import Image, ImageStat
          im = Image.open('build/android-texture-screenshot.png').convert('RGB')
          stat = ImageStat.Stat(im)
          extrema = im.getextrema()
          colors = im.resize((160,160)).getcolors(maxcolors=1000000)
          unique = len(colors or [])
          spread = sum(b-a for a,b in extrema)
          mean_std = sum(stat.stddev)
          print('ANDROID SCREENSHOT unique_colors=', unique)
          print('ANDROID SCREENSHOT channel_spread=', spread)
          print('ANDROID SCREENSHOT stddev_sum=', mean_std)
          assert unique > 500, 'screenshot is too flat'
          assert mean_std > 10.0, 'screenshot has insufficient visual variation'
          PY
      - name: Upload Android texture evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Roma-BRT-V11-Android-Texture-Evidence
          path: |
            build/android-texture-logcat.txt
            build/android-texture-screenshot.png
            build/Roma-BRT-V11-Android-TextureTest.apk
          if-no-files-found: warn
          retention-days: 14
