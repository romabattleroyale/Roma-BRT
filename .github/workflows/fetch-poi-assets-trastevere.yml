name: Fetch Trastevere POI Assets

on:
  push:
    branches:
      - poi-assets-trastevere
  workflow_dispatch:

jobs:
  fetch-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated POI branch
        uses: actions/checkout@v4

      - name: Fetch external CC0 assets from Poly Haven API
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib, shutil, subprocess, urllib.request, zipfile

          OUT = pathlib.Path('POI_External_Assets/Trastevere_Isola_Tiberina')
          OUT.mkdir(parents=True, exist_ok=True)
          UA = 'RomaBattleRoyale-POI-Lab/1.0'

          models = [
              'tree_small_02',
              'jacaranda_tree',
              'island_tree_01',
              'island_tree_03',
              'fern_02',
          ]
          textures = [
              'cobblestone_01',
              'cobblestone_pavement',
              'stone_wall',
              'stone_tile_wall',
              'brick_wall_003',
          ]

          def get_json(url):
              req = urllib.request.Request(url, headers={'User-Agent': UA})
              with urllib.request.urlopen(req, timeout=60) as r:
                  return json.load(r)

          def download(url, path):
              req = urllib.request.Request(url, headers={'User-Agent': UA})
              with urllib.request.urlopen(req, timeout=180) as r, open(path, 'wb') as f:
                  shutil.copyfileobj(r, f)

          def get_url(tree, preferred):
              node = tree
              for key in preferred:
                  if isinstance(node, dict) and key in node:
                      node = node[key]
                  else:
                      return None
              if isinstance(node, dict):
                  return node.get('url')
              return None

          manifest = {'source': 'Poly Haven', 'license': 'CC0', 'models': [], 'textures': []}

          for asset in models:
              files = get_json(f'https://api.polyhaven.com/files/{asset}')
              url = get_url(files, ['gltf', '1k', 'gltf']) or get_url(files, ['gltf', '2k', 'gltf'])
              if not url:
                  raise RuntimeError(f'No glTF download URL found for {asset}')
              dst = OUT / 'models' / asset
              dst.mkdir(parents=True, exist_ok=True)
              raw = dst / 'download'
              download(url, raw)
              if zipfile.is_zipfile(raw):
                  with zipfile.ZipFile(raw) as z:
                      z.extractall(dst)
                  raw.unlink()
              else:
                  raw.rename(dst / pathlib.Path(url).name)
              manifest['models'].append({'id': asset, 'resolution': '1k'})

          for asset in textures:
              files = get_json(f'https://api.polyhaven.com/files/{asset}')
              url = get_url(files, ['zip', '1k', 'zip']) or get_url(files, ['zip', '2k', 'zip'])
              if not url:
                  raise RuntimeError(f'No ZIP download URL found for texture {asset}')
              dst = OUT / 'textures' / asset
              dst.mkdir(parents=True, exist_ok=True)
              raw = dst / 'download.zip'
              download(url, raw)
              with zipfile.ZipFile(raw) as z:
                  z.extractall(dst)
              raw.unlink()
              manifest['textures'].append({'id': asset, 'resolution': '1k'})

          (OUT / 'manifest.json').write_text(json.dumps(manifest, indent=2), encoding='utf-8')
          PY

      - name: Package isolated POI asset pack
        shell: bash
        run: |
          zip -r Trastevere_Isola_Tiberina_External_Assets.zip POI_External_Assets/Trastevere_Isola_Tiberina

      - name: Upload asset pack
        uses: actions/upload-artifact@v4
        with:
          name: Trastevere-Isola-Tiberina-External-Assets
          path: Trastevere_Isola_Tiberina_External_Assets.zip
          if-no-files-found: error
