name: Download POI Tiber assets - exactly 9 GLB

on:
  push:
    branches:
      - poi-assets-trastevere
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    env:
      SKETCHFAB_TOKEN: ${{ secrets.SKETCHFAB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Check token
        shell: bash
        run: |
          set -e
          test -n "$SKETCHFAB_TOKEN"

      - name: Install tools
        shell: bash
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y jq unzip python3-pip
          python3 -m pip install --quiet pygltflib
          npm install --global @gltf-transform/cli

      - name: Download exactly 9 Sketchfab assets
        shell: bash
        run: |
          set -euo pipefail
          ROOT="poi_test_tiber_island/poi_test/assets/models"
          rm -rf "$ROOT"
          mkdir -p "$ROOT"

          assets=(
            "ponte_fabricio|8511381f0b844306ab53e4fbc5660095"
            "ponte_cestio|58691a67ba774f2bbccff7ce8f85d1d8"
            "basilica_san_bartolomeo|132e19cdff9247f092c8d85f903d67fc"
            "torre_caetani|6c821f2aae3b4e8db5d94c6f48fb568b"
            "casa_01|bb5406594f4d4dd59daf1e19cb08e88c"
            "pavimento|a70ea3530a004baebe6c33c29cebe1de"
            "fontana|8580500134194ba5be3f6df7593049f2"
            "lampione|d75f8d8a26054e3584f55eb07644801a"
            "albero|196525a9936a40c1ba7e74ce5c071d59"
          ]

          for item in "${assets[@]}"; do
            NAME="${item%%|*}"
            UID="${item##*|}"
            META="/tmp/${NAME}.json"
            DL="/tmp/${NAME}-download.json"
            ZIP="/tmp/${NAME}.zip"
            DIR="/tmp/${NAME}"
            OUT="$ROOT/${NAME}.glb"

            curl -fsSL "https://api.sketchfab.com/v3/models/${UID}" -o "${META}"
            LICENSE=$(jq -r '.license.label // empty' "${META}")
            DOWNLOADABLE=$(jq -r '.isDownloadable // false' "${META}")
            case "${LICENSE}" in
              "CC Attribution"|"CC0") ;;
              *) echo "Rejected ${NAME}: license=${LICENSE}"; exit 1 ;;
            esac
            test "${DOWNLOADABLE}" = "true"

            CODE=$(curl -sS -o "${DL}" -w "%{http_code}" -H "Authorization: Bearer ${SKETCHFAB_TOKEN}" "https://api.sketchfab.com/v3/models/${UID}/download")
            if [ "${CODE}" != "200" ]; then
              CODE=$(curl -sS -o "${DL}" -w "%{http_code}" -H "Authorization: Token ${SKETCHFAB_TOKEN}" "https://api.sketchfab.com/v3/models/${UID}/download")
            fi
            test "${CODE}" = "200"

            URL=$(jq -r '.gltf.url // empty' "${DL}")
            test -n "${URL}"
            curl -fsSL "${URL}" -o "${ZIP}"

            rm -rf "${DIR}"
            mkdir -p "${DIR}"
            unzip -q "${ZIP}" -d "${DIR}"
            GLTF=$(find "${DIR}" -type f -name '*.gltf' | head -n 1)
            test -n "${GLTF}"

            gltf-transform copy "${GLTF}" "${OUT}"

            rm -rf "${DIR}" "${ZIP}" "${DL}" "${META}"
            test -s "${OUT}"
          done

      - name: Validate exact 9 files and budgets
        shell: bash
        run: |
          set -euo pipefail
          ROOT="poi_test_tiber_island/poi_test/assets/models"
          EXPECTED="albero basilica_san_bartolomeo casa_01 fontana lampione pavimento ponte_cestio ponte_fabricio torre_caetani"
          ACTUAL=$(find "$ROOT" -maxdepth 1 -type f -name '*.glb' -printf '%f\n' | sed 's/\.glb$//' | sort | tr '\n' ' ')
          WANT=$(printf '%s\n' $EXPECTED | sort | tr '\n' ' ')
          test "$ACTUAL" = "$WANT"
          test "$(find "$ROOT" -maxdepth 1 -type f -name '*.glb' | wc -l)" -eq 9
          test "$(find "$ROOT" -type f | wc -l)" -eq 9

          python3 - <<'PY'
from pathlib import Path
from pygltflib import GLTF2
root=Path("poi_test_tiber_island/poi_test/assets/models")
total=0
size=sum(p.stat().st_size for p in root.glob("*.glb"))
if size >= 50*1024*1024: raise SystemExit("GLB budget exceeded")
for p in sorted(root.glob("*.glb")):
    g=GLTF2().load_binary(str(p))
    tris=0
    for mesh in g.meshes or []:
        for prim in mesh.primitives:
            if prim.indices is not None:
                n=g.accessors[prim.indices].count
            elif prim.attributes.POSITION is not None:
                n=g.accessors[prim.attributes.POSITION].count
            else:
                n=0
            tris += n//3
    print(p.name, tris, "triangles")
    if tris>15000: raise SystemExit(f"{p.name} exceeds 15000 triangles")
    total += tris
    for image in g.images or []:
        if image.uri: raise SystemExit(f"{p.name} has external texture")
if total>=200000: raise SystemExit("Total triangle budget exceeded")
print("PASS", total, "triangles", size, "bytes")
PY

      - name: Write manifest
        shell: bash
        run: |
          cat > poi_test_tiber_island/poi_test/assets/MANIFEST.md <<'EOF'
# Isola Tiberina - exactly 9 Sketchfab GLB assets

| File | Original model | Author | License | Sketchfab |
|---|---|---|---|---|
| ponte_fabricio.glb | Roman Bridge | Samuel Brunner | CC Attribution | https://sketchfab.com/3d-models/roman-bridge-8511381f0b844306ab53e4fbc5660095 |
| ponte_cestio.glb | Stone Bridge_3arch | xplanepilot | CC Attribution | https://sketchfab.com/3d-models/stone-bridge-3arch-58691a67ba774f2bbccff7ce8f85d1d8 |
| basilica_san_bartolomeo.glb | Low Poly Church | Yanez Designs | CC Attribution | https://sketchfab.com/3d-models/low-poly-church-132e19cdff9247f092c8d85f903d67fc |
| torre_caetani.glb | Medieval Tower | Den | CC Attribution | https://sketchfab.com/3d-models/medieval-tower-6c821f2aae3b4e8db5d94c6f48fb568b |
| casa_01.glb | Lowpoly medieval house | v_pustote | CC Attribution | https://sketchfab.com/3d-models/lowpoly-medieval-house-bb5406594f4d4dd59daf1e19cb08e88c |
| pavimento.glb | cobblestone ground - lowpoly | SPLEEN VISION | CC Attribution | https://sketchfab.com/3d-models/cobblestone-ground-lowpoly-a70ea3530a004baebe6c33c29cebe1de |
| fontana.glb | Italian style fountain | yorre.detavernier | CC Attribution | https://sketchfab.com/3d-models/fountain-8580500134194ba5be3f6df7593049f2 |
| lampione.glb | Rusty Streetlight | barbodoji | CC Attribution | https://sketchfab.com/3d-models/rusty-streetlight-d75f8d8a26054e3584f55eb07644801a |
| albero.glb | Free Pack - Tree | PolyOne Studio | CC Attribution | https://sketchfab.com/3d-models/free-pack-tree-196525a9936a40c1ba7e74ce5c071d59 |
EOF

      - name: Commit the 9 validated GLB
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add poi_test_tiber_island/poi_test/assets/models poi_test_tiber_island/poi_test/assets/MANIFEST.md
          git add -u poi_test_tiber_island/poi_test/assets/models
          git commit -m "POI Isola Tiberina - 9 validated Sketchfab GLB" || echo "No changes"
          git push
