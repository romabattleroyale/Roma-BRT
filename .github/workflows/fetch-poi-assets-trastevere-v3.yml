name: Fetch Trastevere POI Assets V3
on:
  push:
    branches: [poi-assets-trastevere]
  workflow_dispatch:
jobs:
  fetch-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download CC0 models and textures
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,pathlib,shutil,urllib.request,zipfile
          OUT=pathlib.Path('POI_External_Assets/Trastevere_Isola_Tiberina'); OUT.mkdir(parents=True,exist_ok=True)
          UA='RomaBattleRoyale-POI-Lab/1.0'
          models=['tree_small_02','jacaranda_tree','island_tree_01','island_tree_03','fern_02']
          textures=['cobblestone_01','cobblestone_pavement','stone_wall','stone_tile_wall','brick_wall_003']
          def j(url):
            with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':UA}),timeout=60) as r:return json.load(r)
          def dl(url,p):
            with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':UA}),timeout=180) as r,open(p,'wb') as f:shutil.copyfileobj(r,f)
          def direct(d,path):
            x=d
            for k in path:
              if not isinstance(x,dict) or k not in x:return None
              x=x[k]
            return x.get('url') if isinstance(x,dict) else None
          manifest={'source':'Poly Haven','license':'CC0','models':[],'textures':[]}
          for a in models:
            d=j('https://api.polyhaven.com/files/'+a);u=direct(d,('gltf','1k','gltf')) or direct(d,('gltf','2k','gltf'))
            if not u:raise RuntimeError('No glTF URL: '+a)
            p=OUT/'models'/a;p.mkdir(parents=True,exist_ok=True);raw=p/'download';dl(u,raw)
            if zipfile.is_zipfile(raw):zipfile.ZipFile(raw).extractall(p);raw.unlink()
            else:raw.rename(p/pathlib.Path(u).name)
            manifest['models'].append({'id':a,'resolution':'1k'})
          for a in textures:
            p=OUT/'textures'/a;p.mkdir(parents=True,exist_ok=True)
            maps={}
            for suffix,key in [('diff','diffuse'),('nor_gl','normal_gl'),('rough','roughness')]:
              u=f'https://dl.polyhaven.org/file/ph-assets/Textures/jpg/1k/{a}/{a}_{suffix}_1k.jpg'
              f=p/f'{a}_{key}_1k.jpg';dl(u,f);maps[key]=f.name
            manifest['textures'].append({'id':a,'resolution':'1k','maps':maps})
          (OUT/'manifest.json').write_text(json.dumps(manifest,indent=2),encoding='utf-8')
          PY
      - name: Package asset pack
        run: zip -r Trastevere_Isola_Tiberina_External_Assets.zip POI_External_Assets/Trastevere_Isola_Tiberina
      - uses: actions/upload-artifact@v4
        with:
          name: Trastevere-Isola-Tiberina-External-Assets-V3
          path: Trastevere_Isola_Tiberina_External_Assets.zip
