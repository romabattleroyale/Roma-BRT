name: Fetch Trastevere POI Assets V3
on:
  push:
    branches: [poi-assets-trastevere]
  workflow_dispatch:
jobs:
  fetch-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download verified CC0 models and textures
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib, shutil, urllib.request, zipfile
          OUT=pathlib.Path('POI_External_Assets/Trastevere_Isola_Tiberina')
          OUT.mkdir(parents=True, exist_ok=True)
          UA='RomaBattleRoyale-POI-Lab/1.1'
          models=['tree_small_02','jacaranda_tree','island_tree_01','island_tree_02','island_tree_03']
          textures=['cobblestone_01','cobblestone_pavement','stone_wall','stone_tile_wall','brick_wall_003']
          def get_json(url):
            req=urllib.request.Request(url,headers={'User-Agent':UA})
            with urllib.request.urlopen(req,timeout=60) as r:return json.load(r)
          def download(url,path):
            req=urllib.request.Request(url,headers={'User-Agent':UA})
            with urllib.request.urlopen(req,timeout=180) as r,open(path,'wb') as f:shutil.copyfileobj(r,f)
          def find_url(obj, wanted):
            if isinstance(obj,dict):
              for v in obj.values():
                hit=find_url(v,wanted)
                if hit:return hit
            elif isinstance(obj,list):
              for v in obj:
                hit=find_url(v,wanted)
                if hit:return hit
            elif isinstance(obj,str) and obj.startswith('http'):
              s=obj.lower()
              if all(x in s for x in wanted):return obj
            return None
          manifest={'source':'Poly Haven API','license':'CC0','resolution':'1k','models':[],'textures':[]}
          for asset in models:
            data=get_json('https://api.polyhaven.com/files/'+asset)
            url=find_url(data,('gltf','1k')) or find_url(data,('gltf','2k'))
            if not url:raise RuntimeError('No glTF download URL found for '+asset)
            folder=OUT/'models'/asset;folder.mkdir(parents=True,exist_ok=True)
            raw=folder/'download.bin';download(url,raw)
            if zipfile.is_zipfile(raw):
              with zipfile.ZipFile(raw) as z:z.extractall(folder)
              raw.unlink()
            else:
              raw.rename(folder/pathlib.Path(url.split('?')[0]).name)
            manifest['models'].append({'id':asset,'url':url})
          for asset in textures:
            data=get_json('https://api.polyhaven.com/files/'+asset)
            folder=OUT/'textures'/asset;folder.mkdir(parents=True,exist_ok=True)
            maps={}
            for tag,key in [('diff','diffuse'),('nor_gl','normal_gl'),('rough','roughness')]:
              url=find_url(data,('jpg','1k',tag)) or find_url(data,('jpg','2k',tag))
              if not url:raise RuntimeError('No '+tag+' texture URL found for '+asset)
              filename=pathlib.Path(url.split('?')[0]).name
              dest=folder/filename;download(url,dest);maps[key]=filename
            manifest['textures'].append({'id':asset,'maps':maps})
          (OUT/'manifest.json').write_text(json.dumps(manifest,indent=2),encoding='utf-8')
          PY
      - name: Validate downloaded pack
        run: |
          test -s POI_External_Assets/Trastevere_Isola_Tiberina/manifest.json
          find POI_External_Assets/Trastevere_Isola_Tiberina -type f | sort
      - name: Package asset pack
        run: zip -r Trastevere_Isola_Tiberina_External_Assets.zip POI_External_Assets/Trastevere_Isola_Tiberina
      - uses: actions/upload-artifact@v4
        with:
          name: Trastevere-Isola-Tiberina-External-Assets-V4
          path: Trastevere_Isola_Tiberina_External_Assets.zip
