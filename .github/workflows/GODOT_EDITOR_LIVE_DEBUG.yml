name: Godot Editor Live Debug

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'main.tscn'
      - 'project.godot'
      - 'v37_integration/**'
      - 'baked_city/**'
      - 'city_library/**'
      - 'roads/**'
      - 'tools/**'
      - '.github/workflows/GODOT_EDITOR_LIVE_DEBUG.yml'
      - '.github/live_debug_trigger.txt'

permissions:
  contents: read

jobs:
  godot-editor-live-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Roma-BRT
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Linux GUI debug tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y xdotool xclip scrot openbox

      - name: Download Godot 4.7.2 editor
        run: |
          set -euo pipefail
          mkdir -p .runtime/godot build/live_debug
          curl -L --fail --retry 3 -o .runtime/godot/godot.zip 'https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip'
          unzip -q .runtime/godot/godot.zip -d .runtime/godot
          GODOT_BIN=$(find .runtime/godot -maxdepth 2 -type f -name 'Godot_v4.7.2-stable_linux.x86_64' | head -n 1)
          test -n "$GODOT_BIN"
          chmod +x "$GODOT_BIN"
          ln -sf "$(realpath "$GODOT_BIN")" .runtime/godot/godot
          .runtime/godot/godot --version

      - name: Pre-import all project resources with Godot editor
        run: |
          set -euo pipefail
          mkdir -p build/live_debug
          set +e
          .runtime/godot/godot --headless --editor --path . --import --verbose >build/live_debug/preimport.log 2>&1
          preimport_status=$?
          set -e
          echo "PREIMPORT_EXIT=$preimport_status"
          test -d .godot/imported
          find .godot/imported -type f | wc -l | awk '{print "IMPORTED_RESOURCES=" $1}'

      - name: Open main.tscn and run project in real Godot editor under Xvfb
        run: |
          set -euo pipefail
          export DISPLAY=:99
          Xvfb :99 -screen 0 1920x1080x24 -ac +extension GLX +render -noreset >/tmp/xvfb.log 2>&1 &
          XVFB_PID=$!
          GODOT_PID=0
          OPENBOX_PID=0
          trap 'kill "$GODOT_PID" 2>/dev/null || true; kill "$OPENBOX_PID" 2>/dev/null || true; kill "$XVFB_PID" 2>/dev/null || true' EXIT
          sleep 2
          openbox --replace >/tmp/openbox.log 2>&1 &
          OPENBOX_PID=$!
          sleep 2

          .runtime/godot/godot --editor --path . main.tscn --rendering-method gl_compatibility --rendering-driver opengl3 --verbose >/tmp/godot_editor_stdout.log 2>&1 &
          GODOT_PID=$!

          for i in $(seq 1 60); do
            if xdotool search --onlyvisible --class Godot >/tmp/godot_windows 2>/dev/null && test -s /tmp/godot_windows; then break; fi
            sleep 1
          done
          test -s /tmp/godot_windows
          GODOT_WIN=$(head -n 1 /tmp/godot_windows)
          echo "GODOT_WINDOW=$GODOT_WIN"
          sleep 8

          # Godot 4.7.2 editor toolbar Play button. Click it instead of relying on F5 delivery.
          xdotool windowactivate --sync "$GODOT_WIN"
          xdotool mousemove --window "$GODOT_WIN" 1459 35
          xdotool click 1
          echo 'PLAY_BUTTON_CLICKED=1459,35'
          sleep 45

          # Godot 4.7.2 editor toolbar Stop button.
          xdotool windowactivate --sync "$GODOT_WIN"
          xdotool mousemove --window "$GODOT_WIN" 1518 35
          xdotool click 1
          echo 'STOP_BUTTON_CLICKED=1518,35'
          sleep 3

          xdotool windowactivate --sync "$GODOT_WIN"
          xdotool key --clearmodifiers alt+o
          sleep 2
          xdotool key --clearmodifiers shift+F12
          sleep 2
          scrot -o build/live_debug/godot_editor_output.png
          xdotool key --clearmodifiers ctrl+a || true
          xdotool key --clearmodifiers ctrl+c || true
          sleep 1
          xclip -selection clipboard -o > build/live_debug/godot_output_clipboard.txt 2>/dev/null || true

          cp /tmp/godot_editor_stdout.log build/live_debug/godot_editor_stdout.log
          cp /tmp/xvfb.log build/live_debug/xvfb.log
          cp /tmp/openbox.log build/live_debug/openbox.log

          echo '=== GODOT EDITOR OUTPUT CAPTURE COMPLETE ==='
          echo '=== RUNTIME MARKERS ==='
          grep -nE 'V11 READY|V11 HLOD|V37 edifici|ROMA ROADS RUNTIME' build/live_debug/godot_editor_stdout.log || true
          echo '=== GODOT ERRORS ==='
          grep -nEi 'ERROR:|SCRIPT ERROR|Parse Error|Invalid call|Nonexistent function|Cannot open file|Failed loading resource|V11 HLOD: missing' build/live_debug/godot_editor_stdout.log || true
          echo '=== PREIMPORT DIAGNOSTICS ==='
          grep -nEi 'ERROR:|SCRIPT ERROR|Parse Error|Invalid call|Nonexistent function|Cannot open file|Failed loading resource|V11 HLOD: missing' build/live_debug/preimport.log || true

      - name: Upload real Godot editor evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: godot-editor-live-debug
          path: build/live_debug
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
