name: Roma Ready Buildings Bake

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'v37_integration/bake_ready_buildings_120.gd'
      - 'v37_integration/validate_ready_templates_memory.gd'
      - 'v37_integration/v11_building_bridge.gd'
      - 'v37_integration/distribute_ready_buildings_quarters.gd'
      - 'v37_integration/generate_quarter_hlod.gd'
      - 'tools/capture_hlod_visual_tests.gd'
      - 'city_library/buildings/houses/roma_architecture_library_v11/scripts/modular_house_factory.gd'
      - 'tools/optimize_v11_textures_mobile.gd'
      - '.github/workflows/ROMA_READY_BUILDINGS_BAKE.yml'

permissions:
  contents: write

env:
  READY_TEMPLATE_TARGET: '120'
  READY_VIRTUAL_TARGET: '587'
  READY_RUNTIME_MAX_ACTIVE: '50'
  HLOD_DISTRICT_TARGET: '12'
  HLOD_MESH_TARGET: '36'

jobs:
  bake-and-validate:
    name: Bake 120 reusable building templates
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout Roma-BRT
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download Godot 4.7.2
        run: |
          set -euo pipefail
          mkdir -p .runtime/godot
          curl -L --fail --retry 3 -o .runtime/godot/godot.zip 'https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip'
          unzip -q .runtime/godot/godot.zip -d .runtime/godot
          GODOT_BIN=$(find .runtime/godot -maxdepth 2 -type f -name 'Godot_v4.7.2-stable_linux.x86_64' | head -n 1)
          test -n "$GODOT_BIN"; chmod +x "$GODOT_BIN"; ln -sf "$(realpath "$GODOT_BIN")" .runtime/godot/godot
          .runtime/godot/godot --version
      - name: Import project before bake
        run: .runtime/godot/godot --headless --editor --path . --quit
      - name: Prepare Roman mobile materials
        run: |
          set -euo pipefail
          .runtime/godot/godot --headless --path . --script res://tools/normalize_v11_texture_paths.gd
          .runtime/godot/godot --headless --path . --script res://tools/optimize_v11_textures_mobile.gd
          .runtime/godot/godot --headless --path . --script res://tools/enforce_v11_facade_style.gd
      - name: Bake 120 reusable templates + 587 placement manifest
        run: |
          set -euo pipefail
          rm -rf baked_city/ready_buildings baked_city/ready_templates baked_city/hlod
          .runtime/godot/godot --headless --path . --script res://v37_integration/bake_ready_buildings_120.gd
          test "$(find baked_city/ready_templates -maxdepth 1 -type f -name 'template_*.tscn' | wc -l)" -eq "$READY_TEMPLATE_TARGET"
          test -f baked_city/ready_templates/manifest.json
          test "$(find baked_city/ready_templates/materials -maxdepth 1 -type f -name '*.tres' | wc -l)" -eq 9
      - name: Distribute 587 placements across 12 districts
        run: |
          set -euo pipefail
          .runtime/godot/godot --headless --path . --script res://v37_integration/distribute_ready_buildings_quarters.gd
          test -f baked_city/ready_templates/manifest.json
      - name: Generate 3-level HLOD for 12 districts
        run: |
          set -euo pipefail
          .runtime/godot/godot --headless --path . --script res://v37_integration/generate_quarter_hlod.gd
          test "$(find baked_city/hlod -maxdepth 1 -type f -name 'quartiere_*_*.res' | wc -l)" -eq "$HLOD_MESH_TARGET"
          test -f baked_city/hlod/roma_palette_512.png
          test -f baked_city/hlod/report.json
      - name: Validate 120 templates, 587 placements and HLOD
        run: |
          set -euo pipefail
          mkdir -p build
          .runtime/godot/godot --headless --path . --script res://v37_integration/validate_ready_templates_memory.gd 2>&1 | tee build/ready_template_memory.log
          python3 - <<'PY'
          import json, glob
          m=json.load(open('baked_city/ready_templates/manifest.json'))
          assert m['placement_count']==587 and m['district_count']==12
          files=glob.glob('baked_city/hlod/quartiere_*_*.res')
          assert len(files)==36, len(files)
          r=json.load(open('baked_city/hlod/report.json'))
          assert r['districts']==12 and r['placement_count']==587
          for d,v in r['levels'].items():
              assert 0 < v['hlod2_tri'] <= 2200, (d,v['hlod2_tri'])
              assert 0 < v['hlod1_tri'] <= 10200, (d,v['hlod1_tri'])
              assert 0 < v['hlod0_tri'] <= 50000, (d,v['hlod0_tri'])
          print('HLOD_STRUCTURE=PASS districts=12 meshes=36 targets=2000/10000')
          PY
      - name: Capture HLOD visual tests and memory states
        run: |
          set -euo pipefail
          mkdir -p build
          xvfb-run -a .runtime/godot/godot --path . --rendering-method gl_compatibility --rendering-driver opengl3 --script res://tools/capture_hlod_visual_tests.gd 2>&1 | tee build/hlod_visual_test.log
          test "$(find build/hlod_visual -maxdepth 1 -type f -name 'A_500m.png' | wc -l)" -eq 1
          test "$(find build/hlod_visual -maxdepth 1 -type f -name 'B_250m.png' | wc -l)" -eq 1
          test "$(find build/hlod_visual -maxdepth 1 -type f -name 'C_50m.png' | wc -l)" -eq 1
          test "$(find build/hlod_visual -maxdepth 1 -type f -name 'D_*.png' | wc -l)" -eq 4
          test -f build/hlod_visual/memory_report.json
      - name: Runtime Godot smoke test
        run: |
          set -euo pipefail
          timeout 120s xvfb-run -a .runtime/godot/godot --path . --rendering-method gl_compatibility --rendering-driver opengl3 --quit-after 900 2>&1 | tee build/runtime_smoke.log || test $? -eq 124
          grep -q 'V11 READY BAKE: COMPLETE loaded=587' build/runtime_smoke.log
          ! grep -q 'V37 edifici:' build/runtime_smoke.log
      - name: Package roma_ready_buildings.zip
        run: |
          set -euo pipefail
          mkdir -p build
          zip -qr build/roma_ready_buildings.zip baked_city/ready_templates baked_city/hlod
          unzip -tq build/roma_ready_buildings.zip
          stat -c 'READY_ARCHIVE_BYTES=%s' build/roma_ready_buildings.zip
          echo "READY_TEMPLATES_COUNT=$(find baked_city/ready_templates -maxdepth 1 -type f -name 'template_*.tscn' | wc -l)"
          echo "HLOD_MESH_COUNT=$(find baked_city/hlod -maxdepth 1 -type f -name 'quartiere_*_*.res' | wc -l)"
      - name: Persist ready template bake to main
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A baked_city/ready_templates baked_city/hlod v37_integration/bake_ready_buildings_120.gd v37_integration/validate_ready_templates_memory.gd v37_integration/v11_building_bridge.gd v37_integration/distribute_ready_buildings_quarters.gd v37_integration/generate_quarter_hlod.gd tools/capture_hlod_visual_tests.gd city_library/buildings/houses/roma_architecture_library_v11/scripts/modular_house_factory.gd tools/optimize_v11_textures_mobile.gd .github/workflows/ROMA_READY_BUILDINGS_BAKE.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'feat: persist three-level district HLOD [skip ci]'
          git reset --hard HEAD
          git clean -fd
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
      - name: Upload roma_ready_buildings.zip
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: roma_ready_buildings
          path: build/roma_ready_buildings.zip
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
          overwrite: false
          include-hidden-files: false
      - name: Upload HLOD report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: district-hlod-report
          path: baked_city/hlod/report.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
          overwrite: false
          include-hidden-files: false
      - name: Upload HLOD visual tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hlod-visual-tests
          path: build/hlod_visual
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
          overwrite: false
          include-hidden-files: false
      - name: Upload memory report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ready-template-memory-report
          path: build/ready_template_memory.log
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
          overwrite: false
          include-hidden-files: false
