name: Roma Ready Buildings Bake

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bake-and-validate:
    name: Bake 587 ready buildings
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout Roma-BRT
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download Godot 4.7.2
        run: |
          set -euo pipefail
          mkdir -p .runtime/godot
          curl -L --fail --retry 3 -o .runtime/godot/godot.zip 'https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip'
          unzip -q .runtime/godot/godot.zip -d .runtime/godot
          GODOT_BIN=$(find .runtime/godot -maxdepth 2 -type f -name 'Godot_v4.7.2-stable_linux.x86_64' | head -n 1)
          test -n "$GODOT_BIN"
          chmod +x "$GODOT_BIN"
          ln -sf "$(realpath "$GODOT_BIN")" .runtime/godot/godot
          .runtime/godot/godot --version
      - name: Import project before bake
        run: |
          set -euo pipefail
          .runtime/godot/godot --headless --editor --path . --quit
          test -d .godot/imported
      - name: Prepare Roman mobile materials
        run: |
          set -euo pipefail
          .runtime/godot/godot --headless --path . --script res://tools/normalize_v11_texture_paths.gd
          .runtime/godot/godot --headless --path . --script res://tools/optimize_v11_textures_mobile.gd
          .runtime/godot/godot --headless --path . --script res://tools/enforce_v11_facade_style.gd
      - name: Bake 587 pre-generated ready buildings
        run: |
          set -euo pipefail
          rm -rf baked_city/ready_buildings
          .runtime/godot/godot --headless --path . --script res://v37_integration/bake_ready_buildings_587.gd
          test "$(find baked_city/ready_buildings -maxdepth 1 -type f -name 'building_*.tscn' | wc -l)" -eq 587
          test "$(find baked_city/ready_buildings/materials -maxdepth 1 -type f -name '*.tres' | wc -l)" -eq 9
      - name: Validate every baked scene has one mesh and one box collision
        run: |
          set -euo pipefail
          .runtime/godot/godot --headless --path . --script res://v37_integration/validate_ready_building_structure.gd
      - name: Progressive ready-bake test — 40
        run: .runtime/godot/godot --headless --path . --script res://v37_integration/validate_ready_buildings_memory.gd -- 40
      - name: Progressive ready-bake test — 100
        run: .runtime/godot/godot --headless --path . --script res://v37_integration/validate_ready_buildings_memory.gd -- 100
      - name: Progressive ready-bake test — 300
        run: .runtime/godot/godot --headless --path . --script res://v37_integration/validate_ready_buildings_memory.gd -- 300
      - name: Progressive ready-bake test — 587
        run: .runtime/godot/godot --headless --path . --script res://v37_integration/validate_ready_buildings_memory.gd -- 587
      - name: Package roma_ready_buildings.zip
        run: |
          set -euo pipefail
          mkdir -p build
          zip -qr build/roma_ready_buildings.zip baked_city/ready_buildings
          unzip -tq build/roma_ready_buildings.zip
          stat -c 'READY_ARCHIVE_BYTES=%s' build/roma_ready_buildings.zip
          echo "READY_BUILDINGS_COUNT=$(find baked_city/ready_buildings -maxdepth 1 -type f -name 'building_*.tscn' | wc -l)"
      - name: Persist ready bake to main
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add baked_city/ready_buildings v37_integration/bake_ready_buildings_587.gd v37_integration/validate_ready_building_structure.gd v37_integration/validate_ready_buildings_memory.gd v37_integration/v11_building_bridge.gd .github/workflows/ROMA_READY_BUILDINGS_BAKE.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'feat: bake 587 ready buildings for mobile [skip ci]'
          git push origin HEAD:main
      - name: Upload roma_ready_buildings.zip
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: roma_ready_buildings
          path: build/roma_ready_buildings.zip
          if-no-files-found: error
          retention-days: 30
