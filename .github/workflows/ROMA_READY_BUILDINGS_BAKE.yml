name: Roma Ready Buildings Bake

# Native Godot visibility architecture: 120 reusable templates + 587 real instances.
# No custom HLOD, LOD1 or MultiMesh generation is used.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'v37_integration/bake_ready_buildings_120.gd'
      - 'v37_integration/validate_ready_templates_memory.gd'
      - 'v37_integration/v11_building_bridge.gd'
      - 'v37_integration/distribute_ready_buildings_quarters.gd'
      - 'city_library/buildings/houses/roma_architecture_library_v11/scripts/modular_house_factory.gd'
      - 'city_library/buildings/houses/roma_architecture_library_v11/scripts/library_building_system.gd'
      - 'v37_integration/mobile_visual_variation.gd'
      - 'v37_integration/terrain_surface_alignment.gd'
      - 'tools/normalize_v11_texture_paths.gd'
      - 'tools/optimize_v11_textures_mobile.gd'
      - 'tools/enforce_v11_facade_style.gd'
      - 'main.tscn'
      - '.github/workflows/ROMA_READY_BUILDINGS_BAKE.yml'
      - '.github/workflows/ROMA_BRT_RUNTIME.yml'

permissions:
  contents: write

env:
  READY_TEMPLATE_TARGET: '120'
  READY_VIRTUAL_TARGET: '587'

jobs:
  bake-and-validate:
    name: Bake 120 reusable building templates
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout Roma-BRT
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Godot 4.7.2
        run: |
          set -euo pipefail
          mkdir -p .runtime/godot
          curl -L --fail --retry 3 -o .runtime/godot/godot.zip 'https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip'
          unzip -q .runtime/godot/godot.zip -d .runtime/godot
          GODOT_BIN=$(find .runtime/godot -maxdepth 2 -type f -name 'Godot_v4.7.2-stable_linux.x86_64' | head -n 1)
          test -n "$GODOT_BIN"; chmod +x "$GODOT_BIN"; ln -sf "$(realpath "$GODOT_BIN")" .runtime/godot/godot
          .runtime/godot/godot --version

      - name: Import project before bake
        run: .runtime/godot/godot --headless --path . --quit-after 8

      - name: Prepare Roman mobile materials
        run: |
          set -euo pipefail
          .runtime/godot/godot --headless --path . --script res://tools/normalize_v11_texture_paths.gd
          .runtime/godot/godot --headless --path . --script res://tools/optimize_v11_textures_mobile.gd
          .runtime/godot/godot --headless --path . --script res://tools/enforce_v11_facade_style.gd

      - name: Bake 120 reusable templates + 587 placement manifest
        run: |
          set -euo pipefail
          rm -rf baked_city/ready_buildings baked_city/ready_templates baked_city/hlod baked_city/lod1
          .runtime/godot/godot --headless --path . --script res://v37_integration/bake_ready_buildings_120.gd
          test "$(find baked_city/ready_templates -maxdepth 1 -type f -name 'template_*.tscn' | wc -l)" -eq "$READY_TEMPLATE_TARGET"
          test -f baked_city/ready_templates/manifest.json
          test "$(find baked_city/ready_templates/materials -maxdepth 1 -type f -name '*.tres' | wc -l)" -eq 9
          test ! -d baked_city/hlod
          test ! -d baked_city/lod1

      - name: Distribute 587 placements across 12 districts
        run: |
          set -euo pipefail
          .runtime/godot/godot --headless --path . --script res://v37_integration/distribute_ready_buildings_quarters.gd
          test -f baked_city/ready_templates/manifest.json

      - name: Validate 120 templates and 587 placements
        run: |
          set -euo pipefail
          mkdir -p build
          .runtime/godot/godot --headless --path . --script res://v37_integration/validate_ready_templates_memory.gd 2>&1 | tee build/ready_template_memory.log
          python3 - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('baked_city/ready_templates/manifest.json').read_text())
          assert m['placement_count']==587 and m['district_count']==12
          assert len(list(Path('baked_city/ready_templates').glob('template_*.tscn'))) == 120
          assert not Path('baked_city/hlod').exists()
          assert not Path('baked_city/lod1').exists()
          print('NATIVE_VISIBILITY_STRUCTURE=PASS templates=120 placements=587 hlod=0 lod1=0')
          PY

      - name: Runtime Godot smoke test
        run: |
          set -euo pipefail
          mkdir -p build/runtime
          set +e
          timeout 120s xvfb-run -a .runtime/godot/godot --path . --rendering-method gl_compatibility --rendering-driver opengl3 --scene res://main.tscn 2>&1 | tee build/runtime/runtime_output.log
          code=${PIPESTATUS[0]}
          set -e
          if [ "$code" -ne 0 ] && [ "$code" -ne 124 ]; then exit "$code"; fi
          grep -q 'V11 NATIVE VISIBILITY: COMPLETE loaded=587 templates=120 buildings=587 range=0-500 fade=self district_planes=12 range=500-5000' build/runtime/runtime_output.log
          grep -q 'V11 CITY DISTRICT PLANES: PASS count=12 size=300x300 y=0.5 range=500-5000 fade=self' build/runtime/runtime_output.log
          ! grep -q 'V37 edifici:' build/runtime/runtime_output.log
          if grep -Eq 'ERROR:|SCRIPT ERROR|Parse Error|Invalid call|Nonexistent function|Cannot open file|Failed loading resource|V11 HLOD|V11 LOD1|MultiMesh|Terrain3D non disponibile|Terrain3D Data non inizializzato|V37 world non pronto' build/runtime/runtime_output.log; then
            echo 'ERROR: Godot runtime Output is not clean'
            grep -E 'ERROR:|SCRIPT ERROR|Parse Error|Invalid call|Nonexistent function|Cannot open file|Failed loading resource|V11 HLOD|V11 LOD1|MultiMesh|Terrain3D non disponibile|Terrain3D Data non inizializzato|V37 world non pronto' build/runtime/runtime_output.log || true
            exit 1
          fi
          echo 'GODOT_RUNTIME_OUTPUT=CLEAN'

      - name: Package native ready buildings
        run: |
          set -euo pipefail
          mkdir -p build
          zip -qr build/roma_ready_buildings_native.zip baked_city/ready_templates
          unzip -tq build/roma_ready_buildings_native.zip
          stat -c 'READY_ARCHIVE_BYTES=%s' build/roma_ready_buildings_native.zip
          echo "READY_TEMPLATES_COUNT=$(find baked_city/ready_templates -maxdepth 1 -type f -name 'template_*.tscn' | wc -l)"

      - name: Persist native ready template bake to main
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A baked_city/ready_templates baked_city/hlod baked_city/lod1 v37_integration/bake_ready_buildings_120.gd v37_integration/validate_ready_templates_memory.gd v37_integration/v11_building_bridge.gd v37_integration/distribute_ready_buildings_quarters.gd v37_integration/terrain_surface_alignment.gd city_library/buildings/houses/roma_architecture_library_v11/scripts/modular_house_factory.gd city_library/buildings/houses/roma_architecture_library_v11/scripts/library_building_system.gd v37_integration/mobile_visual_variation.gd tools/normalize_v11_texture_paths.gd tools/optimize_v11_textures_mobile.gd tools/enforce_v11_facade_style.gd main.tscn .github/workflows/ROMA_READY_BUILDINGS_BAKE.yml .github/workflows/ROMA_BRT_RUNTIME.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'feat: switch buildings to native Godot visibility [skip ci]'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

      - name: Upload native ready buildings archive
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: roma_ready_buildings_native
          path: build/roma_ready_buildings_native.zip
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
          overwrite: false
          include-hidden-files: false

      - name: Upload runtime log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-visibility-runtime-log
          path: build/runtime/runtime_output.log
          if-no-files-found: warn
          retention-days: 30
