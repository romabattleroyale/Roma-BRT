name: Import Rome Terrain Geodata
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tools/import_rome_geodata.py"
      - ".github/workflows/IMPORT_ROME_TERRAIN_GEODATA.yml"
permissions:
  contents: write
jobs:
  import-geodata:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download real OpenStreetMap roads and elevation
        run: python tools/import_rome_geodata.py
      - name: Validate imported dataset
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("data/rome_geodata/roads.geojson")
          d = json.loads(p.read_text())
          assert d.get("type") == "FeatureCollection"
          assert len(d.get("features", [])) >= 20, f"Too few road ways: {len(d.get('features', []))}"
          print(f"Validated {len(d['features'])} OSM ways; file size={p.stat().st_size} bytes")
          e = Path("data/rome_geodata/elevation.json")
          dem = json.loads(e.read_text())
          assert dem["width"] == dem["height"] == 41
          assert len(dem["elevation_metres_north_to_south"]) == 41
          print("Validated 41x41 real elevation samples (50 m grid)")
          river = Path("terrain_materials/river_path.json")
          rp = json.loads(river.read_text())
          points = rp.get("points", [])
          assert rp.get("source", "").startswith("OpenStreetMap contributors")
          assert len(points) >= 20, f"Too few Tevere points: {len(points)}"
          assert all(0 <= p["x"] <= 1080 and 0 <= p["z"] <= 1080 for p in points)
          assert all(35 <= p["half_width"] <= 60 for p in points)
          print(f"Validated real OSM Tevere centerline: {len(points)} points; half-width={rp['half_width_m']} m")
          PY
      - name: Commit imported source data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/rome_geodata/roads.geojson data/rome_geodata/elevation.json terrain_materials/river_path.json
          if git diff --cached --quiet; then
            echo "No geodata changes to commit."
          else
            git commit -m "Import real Rome road network and terrain elevation"
            git push origin HEAD:main
          fi
