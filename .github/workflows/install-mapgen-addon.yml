
name: Install MapGen addon

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main project
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Download MapGen
        uses: actions/checkout@v4
        with:
          repository: MarcelloMorettoni/mapgen
          path: mapgen-source

      - name: Install addon
        run: |
          test -f mapgen-source/addons/mapgen/plugin.cfg
          mkdir -p addons
          rm -rf addons/mapgen
          cp -a mapgen-source/addons/mapgen addons/mapgen
          find addons/mapgen -type d -name .godot -prune -exec rm -rf {} +

      - name: Commit to main
        run: |
          if [ -f addons/mapgen/plugin.cfg ] && git ls-files --error-unmatch addons/mapgen/plugin.cfg >/dev/null 2>&1; then
            echo "MapGen is already tracked in the repository"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+users.noreply.github.com"
          git add -f addons/mapgen
          git status --short
          git commit -m "Install MapGen addon into main project"
          git push origin HEAD:main
          
