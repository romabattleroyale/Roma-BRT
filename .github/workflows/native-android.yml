name: Native Android compile and APK check
on:
  push:
    branches: [main]
    paths:
      - "native-android/**"
      - ".github/workflows/native-android.yml"
  pull_request:
    paths:
      - "native-android/**"
      - ".github/workflows/native-android.yml"
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Compile Kotlin and resources
        run: gradle -p native-android compileDebugKotlin
      - name: Assemble debug APK
        run: gradle -p native-android assembleDebug
      - name: Verify APK exists
        run: test -s native-android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: sentinel-one-debug-apk
          path: native-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
