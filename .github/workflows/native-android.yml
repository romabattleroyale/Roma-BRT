name: Native Android source checks
on:
  push:
    branches: [main]
    paths:
      - "native-android/**"
      - ".github/workflows/native-android.yml"
  pull_request:
    paths:
      - "native-android/**"
      - ".github/workflows/native-android.yml"
  workflow_dispatch:

concurrency:
  group: native-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.4"
      - name: Compile Kotlin source
        run: gradle -p native-android compileDebugKotlin
      - name: Run unit tests
        run: gradle -p native-android testDebugUnitTest
