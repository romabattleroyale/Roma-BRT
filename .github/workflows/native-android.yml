name: Native Android Kotlin checks
on:
  push:
    branches: [main]
    paths:
      - "native-android/**"
      - ".github/workflows/native-android.yml"
  pull_request:
    paths:
      - "native-android/**"
      - ".github/workflows/native-android.yml"
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.4"
      - name: Check Kotlin compilation
        run: gradle -p native-android compileDebugKotlin
      - name: Build installable debug APK
        run: gradle -p native-android assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: sentinel-one-debug-apk
          path: native-android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
