name: DIAGNOSTIC Pure Orange Facades

on:
  push:
    paths:
      - '.github/workflows/DIAGNOSTIC_PURE_ORANGE_FACADES.yml'

permissions:
  contents: read

jobs:
  diagnostic:
    name: Compatibility pure-orange facade diagnostic
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Roma-BRT
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download Godot 4.7.2
        run: |
          set -euo pipefail
          mkdir -p .runtime/godot
          curl -L --fail --retry 3 -o .runtime/godot/godot.zip 'https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip'
          unzip -q .runtime/godot/godot.zip -d .runtime/godot
          GODOT_BIN=$(find .runtime/godot -maxdepth 2 -type f -name 'Godot_v4.7.2-stable_linux.x86_64' | head -n 1)
          chmod +x "$GODOT_BIN"
          ln -sf "$(realpath "$GODOT_BIN")" .runtime/godot/godot
          .runtime/godot/godot --version
      - name: Prepare V11 city
        run: |
          set -euo pipefail
          .runtime/godot/godot --headless --path . --script res://tools/normalize_v11_texture_paths.gd
          .runtime/godot/godot --headless --editor --path . --quit
          .runtime/godot/godot --headless --path . --script res://v37_integration/bake_587_city_ci.gd
          .runtime/godot/godot --headless --path . --script res://tools/optimize_v11_archetypes.gd
      - name: Apply TEMPORARY pure-orange facade material only
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('tools/enforce_v11_facade_style.gd')
          s = p.read_text()
          s = re.sub(r'    var albedo := .*?\n    var normal := .*?\n    var roughness := .*?\n    if albedo == null or normal == null or roughness == null:\n        .*?\n        quit\(2\)\n        return\n\n', '', s, flags=re.S)
          start = s.index('        var color: Color = FACADE_COLORS')
          end = s.index('        var err := ResourceSaver.save(material, path)', start)
          replacement = '''        var test_mat := StandardMaterial3D.new()\n        test_mat.albedo_color = Color(1.0, 0.5, 0.0)\n        test_mat.albedo_texture = null\n        test_mat.normal_texture = null\n        test_mat.roughness_texture = null\n        test_mat.roughness = 1.0\n        material = test_mat\n\n'''
          s = s[:start] + replacement + s[end:]
          s = s.replace('        var err := ResourceSaver.save(material, path)', '        var err := ResourceSaver.save(material, path)')
          s = s.replace('print("V11 ART FINAL PASS: facade_materials=%d palette=6 textures=weathered" % facade_count)', 'print("DIAGNOSTIC PURE ORANGE PASS: facade_materials=%d texture=NONE normal=NONE roughness_texture=NONE" % facade_count)')
          p.write_text(s)
          PY
          .runtime/godot/godot --headless --path . --script res://tools/enforce_v11_facade_style.gd
      - name: Force runtime facade override to pure orange, no textures
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('v37_integration/mobile_visual_variation.gd')
          s = p.read_text()
          a = s.index('func _facade_material(color: Color) -> StandardMaterial3D:')
          b = s.index('\nfunc _roof_material', a)
          replacement = '''func _facade_material(color: Color) -> StandardMaterial3D:\n    var material := StandardMaterial3D.new()\n    material.albedo_color = Color(1.0, 0.5, 0.0)\n    material.albedo_texture = null\n    material.normal_texture = null\n    material.roughness_texture = null\n    material.roughness = 1.0\n    return material\n'''
          p.write_text(s[:a] + replacement + s[b:])
          PY
          .runtime/godot/godot --headless --path . --script res://tools/validate_v11_scale_mobile.gd -- 5 | tee diagnostic.log
          grep -E 'DIAGNOSTIC PURE ORANGE PASS|\[MAT\]|facade|Texture: MANCANTE' diagnostic.log | tail -n 40 || true
      - name: Package diagnostic evidence
        if: always()
        run: |
          mkdir -p build
          cp diagnostic.log build/diagnostic.log 2>/dev/null || true
          zip -qr build/Roma-BRT-PURE-ORANGE-DIAGNOSTIC.zip diagnostic.log baked_city/v11_shared_materials 2>/dev/null || true
      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Roma-BRT-PURE-ORANGE-DIAGNOSTIC
          path: build/Roma-BRT-PURE-ORANGE-DIAGNOSTIC.zip
          if-no-files-found: warn
          retention-days: 7
