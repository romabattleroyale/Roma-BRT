name: _Fix Runtime Scene

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fix Node3D orientation and runtime road assertion
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          roads = Path('roads/simple_roads.gd')
          text = roads.read_text()
          old = 'instance.look_at(midpoint + direction.normalized(), Vector3.UP)'
          new = 'instance.look_at_from_position(midpoint, midpoint + direction.normalized(), Vector3.UP)'
          if old not in text:
              raise SystemExit('expected Node3D look_at call not found')
          roads.write_text(text.replace(old, new, 1))

          workflow = Path('.github/workflows/ROMA_BRT_RUNTIME.yml')
          text = workflow.read_text()
          old_runtime = "grep -q 'ROMA ROADS RUNTIME: PASS districts=12 bridges=4 GridMap=manual' build/runtime/godot_runtime.log"
          new_runtime = "grep -q 'ROMA ROADS V2: PASS network=12_districts main_edges=17 sidewalks=enabled drainage=enabled street_furniture=enabled' build/runtime/godot_runtime.log"
          if old_runtime not in text:
              raise SystemExit('expected legacy road runtime assertion not found')
          workflow.write_text(text.replace(old_runtime, new_runtime, 1))
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add roads/simple_roads.gd .github/workflows/ROMA_BRT_RUNTIME.yml
          git commit -m 'fix: prevent pre-tree look_at runtime errors'
          git push origin HEAD:main

      - name: Remove temporary fixer workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/_fix_runtime_scene.yml
          git commit -m 'chore: remove temporary runtime scene fixer'
          git push origin HEAD:main
