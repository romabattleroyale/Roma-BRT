name: Roma Roads GridMap Full

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: roma-roads-gridmap-full
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  road-full:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Roma-BRT
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Godot 4.7.2
        uses: chickensoft-games/setup-godot@v2
        with:
          version: '4.7.2'
          use-dotnet: false
          include-templates: false

      - name: Build full GridMap road system
        run: godot --headless --path . --script res://roads/build_road_city_gridmap.gd

      - name: Validate 12 districts + 4 bridges
        shell: bash
        run: |
          set -euo pipefail
          test -s roads/roma_road_mesh_library.tres
          for i in $(seq -w 1 12); do test -s "roads/generated/district_${i}_roads.tscn"; grep -q 'GridMap' "roads/generated/district_${i}_roads.tscn"; done
          for name in ponte_sisto ponte_santangelo ponte_vittorio ponte_garibaldi; do test -s "roads/generated/${name}.tscn"; done
          grep -q 'cell_size = Vector3(4, 0.15, 4)' roads/generated/district_01_roads.tscn
          echo 'ROMA ROADS VALIDATION: PASS districts=12 bridges=4'

      - name: Persist GridMap roads to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          tmp_dir="$(mktemp -d)"
          cp roads/roma_road_mesh_library.tres "$tmp_dir/roma_road_mesh_library.tres"
          cp -r roads/generated "$tmp_dir/generated"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            rm -rf roads/generated roads/roma_road_mesh_library.tres
            cp "$tmp_dir/roma_road_mesh_library.tres" roads/roma_road_mesh_library.tres
            cp -r "$tmp_dir/generated" roads/generated
            git add roads/roma_road_mesh_library.tres roads/generated
            if git diff --cached --quiet; then
              echo 'ROMA ROADS PERSIST: no changes'
              exit 0
            fi
            git commit -m 'feat: persist GridMap road system [skip ci]'
            if git push origin HEAD:main; then
              echo 'ROMA ROADS PERSIST: PASS'
              exit 0
            fi
            sleep 3
          done
          echo 'ROMA ROADS PERSIST: FAIL push after retries'
          exit 1

      - name: Capture actual full district + memory report
        run: timeout 60s xvfb-run -a godot --path . --display-driver x11 --rendering-method gl_compatibility --audio-driver Dummy --script res://roads/capture_road_pilot.gd

      - name: Package full road artifact
        run: |
          mkdir -p build/road_full_package
          cp roads/roma_road_mesh_library.tres build/road_full_package/
          cp -r roads/generated build/road_full_package/generated
          cp build/road_pilot/road_pilot_topdown.png build/road_pilot/road_pilot_memory_report.txt build/road_full_package/
          du -cb build/road_full_package/* | tail -1
          cd build/road_full_package && zip -9 -r ../roma_roads_gridmap_full.zip *

      - name: Upload full road package
        uses: actions/upload-artifact@v4
        with:
          name: roma-roads-gridmap-full
          path: build/roma_roads_gridmap_full.zip
          if-no-files-found: error

      - name: Upload road screenshot
        uses: actions/upload-artifact@v4
        with:
          name: roma-roads-gridmap-topdown
          path: build/road_pilot/road_pilot_topdown.png
          if-no-files-found: error

      - name: Upload road memory report
        uses: actions/upload-artifact@v4
        with:
          name: roma-roads-gridmap-memory
          path: build/road_pilot/road_pilot_memory_report.txt
          if-no-files-found: error