name: Colosseo Quality Lab
on:
  push:
    branches: [colosseo-quality-lab]
    paths:
      - 'quality_lab/**'
      - '.github/workflows/COLOSSEO_QUALITY_LAB.yml'
  workflow_dispatch:
jobs:
  godot-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb unzip
          curl -L --fail -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
      - name: Import project and parse scripts
        run: |
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --editor --path quality_lab --quit
      - name: Launch runtime smoke test
        run: |
          timeout 25s /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path quality_lab --quit-after 4
