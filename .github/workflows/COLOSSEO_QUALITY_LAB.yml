name: Colosseo Quality Lab
on:
  push:
    branches: [colosseo-quality-lab]
    paths:
      - 'quality_lab/**'
      - '.github/workflows/COLOSSEO_QUALITY_LAB.yml'
  workflow_dispatch:
jobs:
  godot-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: quality_lab
          sparse-checkout-cone-mode: true
      - name: Install runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb unzip libgl1-mesa-dri
          curl -L --fail -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
      - name: Import project and parse scripts
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --editor --path quality_lab --quit 2>&1 | tee /tmp/godot-import.log
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script" /tmp/godot-import.log; then
            echo "Godot reported script errors during import."
            exit 1
          fi
      - name: Launch runtime smoke test
        shell: bash
        run: |
          set -o pipefail
          timeout 25s /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path quality_lab --quit-after 4 2>&1 | tee /tmp/godot-runtime.log
          if grep -E "SCRIPT ERROR|Parse Error|Invalid call|Invalid access|Node not found" /tmp/godot-runtime.log; then
            echo "Godot reported runtime script errors."
            exit 1
          fi
      - name: Render real preview screenshot
        run: |
          mkdir -p artifacts
          timeout 90s xvfb-run -a -s "-screen 0 1600x900x24" /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --path quality_lab --script res://capture.gd
          test -s artifacts/colosseo_exterior.png
          test -s artifacts/colosseo_interior.png
          test -s artifacts/roma_district_overview.png
      - name: Upload rendered preview
        uses: actions/upload-artifact@v4
        with:
          name: colosseo-quality-lab-preview
          path: artifacts/*.png
          if-no-files-found: error
      - name: Upload standalone Godot project
        uses: actions/upload-artifact@v4
        with:
          name: roma-brt-quality-lab-project
          path: quality_lab/**
          if-no-files-found: error
