name: Tiber POI verified downloader

on:
  push:
    branches: [poi-assets-trastevere]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Verify Sketchfab token
        env:
          SKETCHFAB_TOKEN: ${{ secrets.SKETCHFAB_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$SKETCHFAB_TOKEN"
          echo "SKETCHFAB_TOKEN is configured"

      - name: Download and validate 9 GLB
        env:
          SKETCHFAB_TOKEN: ${{ secrets.SKETCHFAB_TOKEN }}
        run: bash tools/download_tiber_assets.sh

      - name: Write attribution manifest
        run: |
          cat > poi_test_tiber_island/poi_test/assets/MANIFEST.md <<'EOF'
# Isola Tiberina - 9 validated Sketchfab GLB assets
- ponte_fabricio.glb — Roman Bridge — Samuel Brunner
- ponte_cestio.glb — Stone Bridge_3arch — xplanepilot
- basilica_san_bartolomeo.glb — Low Poly Church — Yanez Designs
- torre_caetani.glb — Medieval Tower — Den
- casa_01.glb — Lowpoly medieval house — v_pustote
- pavimento.glb — cobblestone ground - lowpoly — SPLEEN VISION
- fontana.glb — Italian style fountain — yorre.detavernier
- lampione.glb — Street lamp (low poly) — pinokio21
- albero.glb — Low Poly Tree — spring
EOF

      - name: Commit validated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add poi_test_tiber_island/poi_test/assets/models poi_test_tiber_island/poi_test/assets/MANIFEST.md
          git commit -m "POI Isola Tiberina - validated 9 Sketchfab GLB" || echo "No changes"
          git push
