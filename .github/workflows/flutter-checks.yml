name: Flutter checks and Android APK

# Cancel stale runs so newer fixes do not wait behind obsolete commits.
concurrency:
  group: flutter-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Run a full APK build on demand from any selected branch.
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: server/requirements.txt
      - name: Install signaling server dependencies
        run: python -m pip install -r server/requirements.txt
      - name: Test signaling relay
        run: python -m unittest discover -s server -p 'test_*.py'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install Flutter dependencies
        run: flutter pub get
      - name: Analyze Dart code
        run: flutter analyze
      - name: Run widget tests
        run: flutter test
      # Pull requests get fast feedback. APK generation is reserved for main
      # pushes or an explicit workflow_dispatch run on the selected branch.
      - name: Generate Android platform files
        if: github.event_name != 'pull_request'
        run: flutter create --platforms=android --org com.sentinelone .
      - name: Configure Android native resources
        if: github.event_name != 'pull_request'
        run: python3 tool/configure_android.py
      - name: Build release APK
        if: github.event_name != 'pull_request'
        run: flutter build apk --release --split-per-abi --target-platform android-arm64
      - name: Verify Android APK architecture
        if: github.event_name != 'pull_request'
        run: |
          APK=build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          test -s "$APK"
          ABIS=$(unzip -Z1 "$APK" | awk -F/ '$1 == "lib" && $2 != "" {print $2}' | sort -u | tr '\n' ' ')
          echo "Native ABIs in APK: $ABIS"
          test "$ABIS" = "arm64-v8a "
          SIZE=$(stat -c%s "$APK")
          echo "Arm64 APK size: $SIZE bytes"
          test "$SIZE" -lt 125829120
      - name: Upload APK artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: sentinel-one-android-apk
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          if-no-files-found: error
          retention-days: 14
