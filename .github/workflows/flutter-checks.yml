name: Flutter and server checks (no APK)

# APK creation is intentionally delegated to the repository owner's Codemagic workflow.
# This workflow only runs tests and static analysis.
concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main, fix/remote-stream-setup]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: server/requirements.txt
      - name: Install signaling server dependencies
        run: python -m pip install -r server/requirements.txt
      - name: Test signaling relay
        run: python -m unittest discover -s server -p 'test_*.py'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install Flutter dependencies
        run: flutter pub get
      - name: Analyze Dart code
        run: flutter analyze
      - name: Run widget tests
        run: flutter test
