name: Flutter checks and Android APK
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install signaling server dependencies
        run: python -m pip install -r server/requirements.txt
      - name: Test signaling relay
        run: python -m unittest discover -s server -p 'test_*.py'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Install Flutter dependencies
        run: flutter pub get
      - name: Analyze Dart code
        run: flutter analyze
      - name: Run widget tests
        run: flutter test
      - name: Generate Android platform files
        run: flutter create --platforms=android --org com.sentinelone .
      - name: Configure Android native resources
        run: python3 tool/configure_android.py
      - name: Build release APK
        run: flutter build apk --release
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sentinel-one-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
