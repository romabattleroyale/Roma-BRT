name: Flutter checks and Android APK
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install signaling server dependencies
        run: python -m pip install -r server/requirements.txt
      - name: Test signaling relay
        run: python -m unittest discover -s server -p 'test_*.py'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Install Flutter dependencies
        run: flutter pub get
      - name: Analyze Dart code
        run: flutter analyze
      - name: Run widget tests
        run: flutter test
      - name: Generate Android platform files
        run: flutter create --platforms=android --org com.sentinelone .
      - name: Configure native video and notification resources
        run: |
          mkdir -p android/app/src/main/res/drawable
          cat > android/app/src/main/res/drawable/ic_stat_sentinel.xml <<'XML'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp"
              android:height="24dp"
              android:viewportWidth="24"
              android:viewportHeight="24">
              <path android:fillColor="#FFFFFFFF"
                  android:pathData="M12,1 L3,5 V11 C3,16.5 6.8,21.3 12,23 C17.2,21.3 21,16.5 21,11 V5 Z M10.5,15.5 L7.5,12.5 L8.9,11.1 L10.5,12.7 L15.5,7.7 L16.9,9.1 Z"/>
          </vector>
          XML
          python3 - <<'PY'
          from pathlib import Path
          groovy = Path('android/app/build.gradle')
          kotlin = Path('android/app/build.gradle.kts')
          if kotlin.exists():
              source = kotlin.read_text()
              if 'pickFirsts' not in source:
                  source = source.replace(
                      'android {',
                      'android {\n    packaging { jniLibs { pickFirsts += setOf("lib/**/libc++_shared.so") } }',
                      1,
                  )
              kotlin.write_text(source)
          elif groovy.exists():
              source = groovy.read_text()
              if 'pickFirst' not in source:
                  source = source.replace(
                      'android {',
                      "android {\n    packagingOptions { pickFirst 'lib/**/libc++_shared.so' }",
                      1,
                  )
              groovy.write_text(source)
          PY
      - name: Add Android camera permission
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          permissions = [
              '    <uses-permission android:name="android.permission.INTERNET" />',
              '    <uses-permission android:name="android.permission.CAMERA" />',
          ]
          for permission in permissions:
              if permission.split('"')[1] not in s:
                  s = s.replace('    <application', permission + chr(10) + '    <application', 1)
          p.write_text(s)
          PY
      - name: Build release APK
        run: flutter build apk --release
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sentinel-one-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
