name: Roma BRT Runtime

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: roma-brt-runtime
  cancel-in-progress: true

jobs:
  runtime-smoke-test:
    name: Godot 4.7.2 Runtime Smoke Test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Verify persisted ready-building templates and native visibility assets
        shell: bash
        run: |
          set -euo pipefail
          test -d baked_city/ready_templates
          template_count=$(find baked_city/ready_templates -maxdepth 1 -type f -name 'template_*.tscn' | wc -l)
          test "$template_count" -eq 120
          test -f baked_city/ready_templates/template_001.tscn
          test -f baked_city/ready_templates/template_120.tscn
          python3 - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('baked_city/ready_templates/manifest.json').read_text())
          placements=data.get('placements',[])
          assert len(placements)==587
          assert data.get('placement_count')==587
          assert data.get('district_count')==12
          assert data.get('river_clearance_m')==100.0
          print('READY_TEMPLATE_COUNT=120')
          print('READY_PLACEMENTS_COUNT=587')
          print('READY_MANIFEST_STRUCTURE=PASS')
          PY
          test ! -d baked_city/hlod
          test ! -d baked_city/lod1
          echo 'NATIVE_VISIBILITY_ASSETS=CLEAN'

      - name: Verify measured modular POI layout
        shell: bash
        run: |
          set -euo pipefail
          test -f city_library/poi/poi_manifest.json
          test -f city_library/poi/poi_manager.gd
          python3 - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('city_library/poi/poi_manifest.json').read_text())
          pois=data.get('pois',[])
          assert len(pois)==13
          assert data['map']['world_size_m']==2000.0
          assert data['map']['world_offset']==[1000.0,0.0,1000.0]
          assert data['placement']['slot_count']==13
          assert data['module_rules']['modular'] is True
          assert data['module_rules']['interior_ready'] is True
          assert data['module_rules']['underground_link_ready'] is True
          assert len({p['target_cell'][0] for p in pois})==7
          assert len({p['target_cell'][1] for p in pois})==3
          print('POI_MANIFEST_STRUCTURE=PASS slots=13 grid=7x3 map=2000x2000m')
          PY

      - name: Verify project metadata and deterministic runtime launcher
        run: |
          set -euo pipefail
          test -f project.godot
          test -f runtime_extension_launcher.tscn
          test -f runtime_extension_launcher.gd
          grep -q 'run/main_scene="res://main.tscn"' project.godot
          grep -q 'GDExtensionManager.load_extension' runtime_extension_launcher.gd
          grep -q 'res://addons/terrain_3d/terrain.gdextension' runtime_extension_launcher.gd
          grep -q 'textures/vram_compression/import_etc2_astc=true' project.godot

      - name: Verify Terrain3D native libraries
        shell: bash
        run: |
          set -euo pipefail
          test -f addons/terrain_3d/terrain.gdextension
          test -f addons/terrain_3d/bin/libterrain.linux.release.x86_64.so
          test -f addons/terrain_3d/bin/libterrain.android.release.arm64.so
          echo 'TERRAIN3D_NATIVE_LIBRARIES=PASS linux_release android_arm64'

      - name: Download Godot 4.7.2
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .runtime/godot
          curl -L --fail --retry 3 -o .runtime/godot/godot.zip 'https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip'
          unzip -q .runtime/godot/godot.zip -d .runtime/godot
          GODOT_BIN=$(find .runtime/godot -maxdepth 2 -type f -name 'Godot_v4.7.2-stable_linux.x86_64' | head -n 1)
          test -n "$GODOT_BIN"
          chmod +x "$GODOT_BIN"
          ln -sf "$(realpath "$GODOT_BIN")" .runtime/godot/godot
          .runtime/godot/godot --version

      - name: Import Godot assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/runtime
          set +e
          .runtime/godot/godot --headless --editor --path . --quit 2>&1 | tee build/runtime/godot_import.log
          code=${PIPESTATUS[0]}
          set -e
          if [ "$code" -ne 0 ]; then exit "$code"; fi
          if grep -Eq 'ERROR:|SCRIPT ERROR|Parse Error|Invalid call|Nonexistent function|Cannot open file|Failed loading resource' build/runtime/godot_import.log; then exit 1; fi
          test -f terrain_runtime.gd
          test -f terrain_runtime_android_safe.gd
          test -d .godot/imported
          echo 'GODOT IMPORT OUTPUT=CLEAN'

      - name: Godot runtime preflight
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/runtime
          set +e
          .runtime/godot/godot --headless --path . --quit-after 8 2>&1 | tee build/runtime/godot_preflight.log
          code=${PIPESTATUS[0]}
          set -e
          if [ "$code" -ne 0 ]; then exit "$code"; fi
          if grep -Eq 'ERROR:|SCRIPT ERROR|Parse Error|Invalid call|Nonexistent function|Cannot open file|Failed loading resource' build/runtime/godot_preflight.log; then exit 1; fi
          echo 'GODOT PREFLIGHT OUTPUT=CLEAN'

      - name: Runtime smoke launch using deterministic Terrain3D launcher
        shell: bash
        run: |
          set -u
          mkdir -p build/runtime
          echo 'RUNTIME_DIAGNOSTICS_BEGIN'
          free -h || true
          grep -E 'MemTotal|MemAvailable|SwapTotal|SwapFree' /proc/meminfo || true
          echo 'RUNTIME_DIAGNOSTICS_LAUNCH'
          set +e
          ROMA_BRT_CI_RUNTIME=1 timeout 300s xvfb-run -a .runtime/godot/godot --path . --display-driver x11 --rendering-method gl_compatibility --rendering-driver opengl3 --audio-driver Dummy --scene res://runtime_extension_launcher.tscn 2>&1 | tee build/runtime/godot_runtime.log
          code=${PIPESTATUS[0]}
          set -e
          echo "GODOT_RUNTIME_EXIT_CODE=$code"
          tail -n 300 build/runtime/godot_runtime.log || true

          # The runtime has historically reached every required game marker and
          # then remained alive waiting for the CI watchdog. Exit 124 therefore
          # means only that the watchdog stopped an otherwise validated session.
          # Validation is based on the game markers below, not on process lifetime.
          grep -q 'TERRAIN3D LAUNCHER CLASSDB=AVAILABLE' build/runtime/godot_runtime.log
          grep -q 'V11 NATIVE VISIBILITY: COMPLETE loaded=587 templates=120 buildings=587 range=0-500 fade=self district_planes=12 range=500-5000' build/runtime/godot_runtime.log
          grep -q 'V11 CITY DISTRICT PLANES: PASS count=12 size=300x300 y=0.5 range=500-5000 fade=self' build/runtime/godot_runtime.log
          grep -q 'ROMA ROADS V2: PASS network=Urban_Grid_corridors collision_safe' build/runtime/godot_runtime.log
          grep -q 'ROMA POI PLACER: PASS slots=13/13' build/runtime/godot_runtime.log
          test "$(grep -c 'ROMA POI SLOT:' build/runtime/godot_runtime.log || true)" -eq 13

          if grep -q 'V37 edifici:' build/runtime/godot_runtime.log; then exit 1; fi
          if grep -Eq 'ERROR:|SCRIPT ERROR|Parse Error|Invalid call|Nonexistent function|Cannot open file|Failed loading resource|V11 HLOD|V11 LOD1|MultiMesh|Terrain3D non disponibile|Terrain3D Data non inizializzato|V37 world non pronto|Attempt to register extension class|Attempt to unregister unexisting extension class' build/runtime/godot_runtime.log; then
            grep -E 'ERROR:|SCRIPT ERROR|Parse Error|Invalid call|Nonexistent function|Cannot open file|Failed loading resource|V11 HLOD|V11 LOD1|MultiMesh|Terrain3D non disponibile|Terrain3D Data non inizializzato|V37 world non pronto|Attempt to register extension class|Attempt to unregister unexisting extension class' build/runtime/godot_runtime.log || true
            exit 1
          fi

          if [ "$code" -eq 0 ]; then
            echo 'GODOT_RUNTIME_TERMINATION=NORMAL'
          elif [ "$code" -eq 124 ]; then
            echo 'GODOT_RUNTIME_TERMINATION=VALIDATED_TIMEOUT_AFTER_MARKERS'
          else
            echo "GODOT_RUNTIME_TERMINATION=FAILED code=$code"
            exit "$code"
          fi
          echo 'GODOT_RUNTIME_OUTPUT=CLEAN'

      - name: Upload runtime logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Roma-BRT-native-visibility-runtime-log
          path: build/runtime
          if-no-files-found: warn
          retention-days: 30
