name: Roma BRT Runtime

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Roma Ready Buildings Bake"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: roma-brt-runtime
  cancel-in-progress: true

jobs:
  runtime-smoke-test:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    name: Godot 4.7.2 Runtime Smoke Test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout persisted ready-bake main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Verify persisted 587 ready buildings
        shell: bash
        run: |
          set -euo pipefail
          test -d baked_city/ready_buildings
          count=$(find baked_city/ready_buildings -maxdepth 1 -type f -name 'building_*.tscn' | wc -l)
          echo "READY_BUILDINGS_COUNT=$count"
          test "$count" -eq 587
          test -f baked_city/ready_buildings/building_001.tscn
          test -f baked_city/ready_buildings/building_587.tscn

      - name: Verify project metadata
        run: |
          set -euo pipefail
          test -f project.godot
          grep -q '^\[application\]' project.godot
          grep -q 'textures/vram_compression/import_etc2_astc=true' project.godot

      - name: Download Godot 4.7.2
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .runtime/godot
          curl -L --fail --retry 3 -o .runtime/godot/godot.zip 'https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip'
          unzip -q .runtime/godot/godot.zip -d .runtime/godot
          GODOT_BIN=$(find .runtime/godot -maxdepth 2 -type f -name 'Godot_v4.7.2-stable_linux.x86_64' | head -n 1)
          test -n "$GODOT_BIN"
          chmod +x "$GODOT_BIN"
          ln -sf "$(realpath "$GODOT_BIN")" .runtime/godot/godot
          .runtime/godot/godot --version

      - name: Import Godot assets
        run: |
          set -euo pipefail
          .runtime/godot/godot --headless --editor --path . --quit
          test -d .godot/imported
          echo 'GODOT IMPORT CACHE OK'

      - name: Validate persisted ready-building structure
        run: |
          set -euo pipefail
          .runtime/godot/godot --headless --path . --script res://v37_integration/validate_ready_building_structure.gd

      - name: Runtime smoke launch using only pre-generated buildings
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/runtime
          code=0
          timeout 45s .runtime/godot/godot --headless --path . --rendering-method gl_compatibility --scene res://main.tscn > build/runtime/godot_runtime.log 2>&1 || code=$?
          if [ "$code" -ne 0 ] && [ "$code" -ne 124 ]; then
            cat build/runtime/godot_runtime.log
            exit "$code"
          fi
          grep -q 'V11 READY BAKE: COMPLETE loaded=587' build/runtime/godot_runtime.log
          if grep -q 'V37 edifici:' build/runtime/godot_runtime.log; then
            echo 'ERROR: procedural V11 building generation ran during runtime'
            exit 1
          fi
          tail -n 250 build/runtime/godot_runtime.log

      - name: Upload runtime log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Roma-BRT-ready-bake-runtime-log
          path: build/runtime/godot_runtime.log
          if-no-files-found: warn
          retention-days: 30
