workflows:
  sentinel-one-android:
    name: SENTINEL ONE Android APK
    max_build_duration: 60
    instance_type: linux_x2
    environment:
      flutter: stable
      android_signing:
        - sentinel_one_keystore
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Analyze Dart code
        script: flutter analyze
      - name: Run tests
        script: flutter test
      - name: Build release APK
        script: flutter build apk --release
    artifacts:
      - build/**/outputs/**/*.apk
    publishing:
      email:
        recipients:
          - romabattleroyale@gmail.com
        notify:
          success: true
          failure: true
