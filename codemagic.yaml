workflows:
  sentinel-one-native-android:
    name: SENTINEL ONE - Kotlin Android (APK by repository owner)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      java: 17
    scripts:
      - name: Compile Kotlin sources
        script: gradle -p native-android compileDebugKotlin
      - name: Build Android release APK
        script: gradle -p native-android assembleRelease
      - name: Verify APK output
        script: |
          APK=native-android/app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          echo "APK size: $(stat -c%s "$APK") bytes"
    artifacts:
      - native-android/app/build/outputs/apk/release/app-release.apk
    publishing:
      email:
        recipients:
          - romabattleroyale@gmail.com
        notify:
          success: true
          failure: true
