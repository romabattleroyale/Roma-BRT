workflows:
  sentinel-one-native-android:
    name: SENTINEL ONE - Kotlin Android (APK by repository owner)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      java: 17
    scripts:
      - name: Compile Kotlin sources
        script: gradle -p native-android compileDebugKotlin
      - name: Build Android release APK
        script: gradle -p native-android assembleRelease
      - name: Verify APK output
        script: |
          set -eu
          APK_DIR="native-android/app/build/outputs/apk"
          echo "Searching for generated APK files..."
          find "$APK_DIR" -type f -name "*.apk" -print
          APK="$(find "$APK_DIR" -type f -name "*.apk" -print -quit)"
          if [ -z "$APK" ]; then
            echo "ERROR: No APK found under $APK_DIR"
            echo "Listing build outputs for diagnosis:"
            find native-android/app/build/outputs -maxdepth 5 -type f -print || true
            exit 1
          fi
          echo "APK found: $APK"
          echo "APK size: $(stat -c%s "$APK") bytes"
    artifacts:
      - native-android/app/build/outputs/**/*.apk
    publishing:
      email:
        recipients:
          - romabattleroyale@gmail.com
        notify:
          success: true
          failure: true
